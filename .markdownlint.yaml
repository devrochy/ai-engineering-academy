# Configuración de markdownlint para el CI del proyecto.
# Reglas deshabilitadas porque son demasiado estrictas para documentación
# de producto redactada en prosa (historias de usuario, ADRs, etc.).

default: true
MD013: false # longitud de línea
MD024: false # encabezados duplicados (frecuentes en historias de usuario)
MD033: false # HTML en línea
MD041: false # el primer encabezado no siempre es H1 en todos los documentos
