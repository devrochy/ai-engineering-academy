name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'

  check-required-docs:
    name: Verificar documentación obligatoria
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que existen los documentos base del proyecto
        run: |
          required_files="README.md CHANGELOG.md BACKLOG.md VISION.md ROADMAP.md CLAUDE.md"
          missing=0
          for f in $required_files; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta el archivo obligatorio: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "CLAUDE.md exige mantener README.md, CHANGELOG.md y BACKLOG.md actualizados en cada cambio."
            exit 1
          fi
